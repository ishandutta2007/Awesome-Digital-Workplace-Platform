<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #a855f7; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
      
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-card-1 { animation: float1 6s ease-in-out infinite; }
      .floating-card-2 { animation: float2 8s ease-in-out infinite; }
      .glowing-orb { animation: pulseGlow 4s ease-in-out infinite; }
      .connecting-line { stroke-dasharray: 8, 8; animation: dashMove 20s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Glowing Orbs (Dynamic background elements) -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="glowing-orb" />
  <circle cx="1050" cy="280" r="160" fill="#ec4899" opacity="0.2" filter="url(#glow)" class="glowing-orb" />

  <!-- Background Grid Network / Flow lines -->
  <path d="M 100 300 Q 300 220 500 280 T 900 180 T 1150 220" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" class="connecting-line"/>
  <path d="M 50 100 Q 350 180 650 100 T 1100 140" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3" class="connecting-line"/>

  <!-- Dynamic Animated Cards positioned safely around text -->
  <!-- Floating Card Right High -->
  <g class="floating-card-1">
    <rect x="860" y="45" width="280" height="90" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <circle cx="895" cy="90" r="18" fill="#6366f1" opacity="0.8"/>
    <text x="890" y="95" class="badge-text" text-anchor="middle">💬</text>
    <text x="925" y="80" class="badge-text">Intranet &amp; Social Hub</text>
    <text x="925" y="102" font-family="sans-serif" font-size="11" fill="#94a3b8">Real-time Employee Feed</text>
  </g>

  <!-- Floating Card Right Low -->
  <g class="floating-card-2">
    <rect x="820" y="210" width="310" height="100" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <circle cx="860" cy="260" r="20" fill="#10b981" opacity="0.8"/>
    <text x="855" y="266" class="badge-text" text-anchor="middle">🚀</text>
    <text x="895" y="250" class="badge-text">Open-Source &amp; Enterprise SaaS</text>
    <text x="895" y="272" font-family="sans-serif" font-size="11" fill="#94a3b8">Curated Top Digital Workplace Tools</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed unobscured title & subtitle) -->
  <g transform="translate(70, 0)">
    <!-- Pill Tag -->
    <rect x="0" y="65" width="220" height="32" rx="16" fill="#6366f1" opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="110" y="86" class="tag" text-anchor="middle">✨ CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="150" class="title">Awesome Digital Workplace</text>
    <text x="0" y="200" class="title" fill="url(#accentGrad)">Platform</text>

    <!-- Subtitle -->
    <text x="0" y="248" class="subtitle">Discover Top SaaS &amp; Open-Source Employee Experience (EXP) Platforms,</text>
    <text x="0" y="276" class="subtitle">Intranets, Knowledge Bases, and Internal Communication Tools</text>

    <!-- Bottom Accent Line -->
    <rect x="0" y="305" width="540" height="4" rx="2" fill="url(#accentGrad)"/>
  </g>
</svg>
